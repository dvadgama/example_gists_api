name: CI

on:
  pull_request:
    branches: [solution]
  push:
    branches: [solution]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_MANAGED_PYTHON: "1"
  GITHUB_BASE_URL: https://api.github.com
  GITHUB_TIMEOUT_SECONDS: "5"
  LOG_LEVEL: INFO

jobs:
  lint:
    name: Lint and formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true

      - run: uv sync --locked

      - name: Check linting
        run: uv run --locked ruff check .

      - name: Check formatting
        run: uv run --locked ruff format --check .

  tests:
    name: Tests and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true

      - run: uv sync --locked

      - name: Run tests with coverage
        env:
          PYTEST_ADDOPTS: >-
            --junitxml=reports/tests.xml
            --cov-report=xml:reports/coverage.xml
        run: |
          mkdir -p reports
          make coverage

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-reports
          path: reports/
          retention-days: 7

  dependency-audit:
    name: Dependency vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Scan locked dependencies
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_INCLUDE_DEV_DEPS: "true"
        with:
          version: v0.76.2
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: json
          output: dependency-audit.json

      - name: Upload dependency report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dependency-report
          path: dependency-audit.json
          retention-days: 7

  image-check:
    name: Build, scan and check container
    needs: [lint, tests, dependency-audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      IMAGE: github-api:${{ github.sha }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build runtime image
        run: ./scripts/build.sh "$IMAGE"

      # - name: Scan runtime image
      #   uses: aquasecurity/trivy-action@v0.36.0
      #   with:
      #     version: v0.76.2
      #     scan-type: image
      #     image-ref: ${{ env.IMAGE }}
      #     scanners: vuln
      #     severity: HIGH,CRITICAL
      #     exit-code: "1"
      #     format: json
      #     output: image-audit.json

      - name: Start container
        run: |
          docker run --detach \
            --name api-smoke \
            --publish 127.0.0.1:8080:8080 \
            --env GITHUB_BASE_URL \
            --env GITHUB_TIMEOUT_SECONDS \
            --env LOG_LEVEL \
            "$IMAGE"

      - name: Check health and runtime user
        run: |
          curl --fail --silent --show-error \
            --retry 10 --retry-delay 1 \
            --retry-all-errors --retry-max-time 30 \
            --max-time 3 \
            --output health.json \
            http://127.0.0.1:8080/health

          python3 -c 'import json; assert json.load(open("health.json")) == {"status": "ok"}'

          test "$(docker exec api-smoke id -u)" != "0"

      - name: Collect logs and remove container
        if: always()
        run: |
          docker logs api-smoke > container.log 2>&1 || true
          docker rm --force api-smoke || true

      - name: Upload container reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: container-reports
          path: |
            image-audit.json
            container.log
          retention-days: 7

      - name: Save tested image
        if: github.event_name == 'push'
        run: docker save "$IMAGE" --output image.tar

      - name: Upload tested image
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: github-api-${{ github.sha }}
          path: image.tar
          compression-level: 0
          retention-days: 7

  app-run:
    name: Run app in local Minikube
    if: github.event_name == 'push'
    needs: image-check
    runs-on: local-runner
    timeout-minutes: 10

    env:
      IMAGE: github-api:${{ github.sha }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build image locally
        run: ./scripts/build.sh "$IMAGE"

      - name: Load image into Minikube
        run: |
          docker image save "$IMAGE" |
            docker exec --interactive minikube docker image load

      - name: Run and expose application
        run: |
          kubectl --context minikube --namespace default \
            delete deployment,service github-api --ignore-not-found
          kubectl --context minikube --namespace default \
            create deployment github-api --image="$IMAGE" --port=8080
          kubectl --context minikube --namespace default \
            expose deployment github-api --type=NodePort \
            --port=8080 --target-port=8080
          kubectl --context minikube --namespace default \
            rollout status deployment/github-api --timeout=120s
          kubectl --context minikube --namespace default \
            get deployment,pods,service
