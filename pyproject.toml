[project]
name = "github-api"
version = "0.1.0"
description = "An HTTP API for public GitHub Gists."
requires-python = "==3.15.2"
dependencies = []

[dependency-groups]
dev = [
    "pre-commit",
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
