[project]
name = "github-api"
version = "0.1.0"
description = "An HTTP API for public GitHub Gists."
requires-python = "==3.15.2"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pre-commit",
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = ["--strict-config", "--strict-markers", "-ra", "-m", "not real"]
markers = [
    "mock: tests that simulate GitHub responses without calling GitHub",
    "real: integration tests that call the live GitHub API (run explicitly)",
]
