repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --locked ruff check --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format check
        entry: uv run --locked ruff format --check --force-exclude
        language: system
        types_or: [python, pyi]
      - id: pytest
        name: pytest
        entry: uv run --locked pytest
        language: system
        types: [python]
        pass_filenames: false
