services:
  api:
    build: .
    image: github-api
    pull_policy: build
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/health', timeout=2).close()"
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
